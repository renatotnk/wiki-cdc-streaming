[project]
name = "wiki-cdc-streaming"
version = "0.3.0"
description = "CDC-style streaming pipeline: Wikipedia EventStreams to a medallion Lakehouse"
authors = [
    { name = "renatotnk", email = "renato-tnk@live.com" }
]
requires-python = ">=3.12"
dependencies = [
    "delta-spark>=4.3.1",
    "google-cloud-pubsub>=2.39.0",
    "google-cloud-storage>=3.13.0",
    "minio>=7.2.20",
    "polars>=1.43.1",
    "pyspark[pipelines]>=4.1.1",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "sseclient-py>=1.9.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "duckdb>=1.5.5",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
